<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Galaxy Arena - Admin</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
* {
    box-sizing: border-box;
}

html, body {
    margin: 0;
    padding: 0;
    min-height: 100%;
    font-family: Arial, sans-serif;
    background: #050817;
    color: white;
}

body {
    overflow-x: hidden;
}

#stars {
    position: fixed;
    inset: 0;
    z-index: 0;
    overflow: hidden;
    pointer-events: none;
}

.star {
    position: absolute;
    width: 2px;
    height: 2px;
    background: white;
    border-radius: 50%;
    opacity: .8;
    animation: twinkle 3s infinite ease-in-out;
}

@keyframes twinkle {
    0%,100% { opacity: .2; }
    50% { opacity: 1; }
}

.container {
    position: relative;
    z-index: 2;
    width: min(1000px, 92%);
    margin: auto;
    padding: 30px 0 60px;
}

.header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 15px;
    margin-bottom: 30px;
    padding: 18px 22px;
    border: 1px solid rgba(120,150,255,.25);
    border-radius: 20px;
    background: rgba(10,16,40,.75);
    backdrop-filter: blur(15px);
}

.logo {
    font-size: 25px;
    font-weight: 900;
}

.logo span {
    color: #7c8cff;
}

.back {
    color: white;
    text-decoration: none;
    padding: 10px 15px;
    border-radius: 12px;
    background: rgba(124,140,255,.15);
}

.card {
    background: rgba(10,16,40,.82);
    border: 1px solid rgba(120,150,255,.25);
    border-radius: 24px;
    padding: 25px;
    margin-bottom: 20px;
    box-shadow: 0 20px 60px rgba(0,0,0,.25);
    backdrop-filter: blur(15px);
}

h1, h2, h3 {
    margin-top: 0;
}

.subtitle {
    color: #aeb7d8;
}

input {
    width: 100%;
    padding: 15px;
    margin: 8px 0;
    border-radius: 12px;
    border: 1px solid rgba(150,170,255,.25);
    outline: none;
    background: rgba(255,255,255,.06);
    color: white;
    font-size: 16px;
}

input::placeholder {
    color: #8891b5;
}

button {
    width: 100%;
    padding: 14px;
    margin-top: 10px;
    border: none;
    border-radius: 12px;
    cursor: pointer;
    color: white;
    font-size: 16px;
    font-weight: bold;
    background: linear-gradient(135deg,#6575ff,#9b5cff);
    transition: .2s;
}

button:hover {
    transform: translateY(-2px);
    filter: brightness(1.1);
}

button.danger {
    background: linear-gradient(135deg,#ff4757,#ff1744);
}

button.secondary {
    background: rgba(255,255,255,.08);
}

.hidden {
    display: none !important;
}

.status {
    padding: 12px;
    border-radius: 12px;
    margin-top: 12px;
    background: rgba(255,255,255,.05);
    color: #cbd3f5;
}

.success {
    color: #7dffb2;
}

.error {
    color: #ff7d8a;
}

.loading {
    color: #aab5ff;
}

.admin-badge {
    display: inline-block;
    padding: 7px 12px;
    border-radius: 50px;
    background: rgba(100,255,160,.12);
    color: #7dffb2;
    border: 1px solid rgba(100,255,160,.2);
    font-weight: bold;
}

.stats {
    display: grid;
    grid-template-columns: repeat(3,1fr);
    gap: 15px;
}

.stat {
    padding: 20px;
    border-radius: 18px;
    background: rgba(255,255,255,.05);
}

.stat small {
    color: #8f99bc;
}

.stat strong {
    display: block;
    margin-top: 8px;
    font-size: 24px;
}

.player-card {
    margin-top: 18px;
    padding: 20px;
    border-radius: 18px;
    background: rgba(100,120,255,.08);
    border: 1px solid rgba(120,150,255,.2);
}

.coin-actions {
    margin-top: 15px;
}

.logout {
    margin-top: 20px;
}

@media(max-width:700px) {
    .header {
        flex-direction: column;
        align-items: stretch;
        text-align: center;
    }

    .stats {
        grid-template-columns: 1fr;
    }
}
</style>
</head>

<body>

<div id="stars"></div>

<div class="container">

    <div class="header">
        <div class="logo">
            🌌 <span>Galaxy Arena</span> Admin
        </div>

        <a class="back" href="index.html">
            ← الموقع الرئيسي
        </a>
    </div>

    <!-- LOGIN -->
    <div id="loginSection" class="card">

        <h1>👑 لوحة الأدمن</h1>

        <p class="subtitle">
            سجّل دخول بحساب الأدمن حتى تدخل لوحة التحكم.
        </p>

        <input
            type="email"
            id="email"
            placeholder="الإيميل"
            autocomplete="email"
        >

        <input
            type="password"
            id="password"
            placeholder="كلمة المرور"
            autocomplete="current-password"
        >

        <button onclick="login()">
            🔐 تسجيل الدخول
        </button>

        <div id="loginStatus" class="status"></div>

    </div>


    <!-- ADMIN DASHBOARD -->
    <div id="dashboard" class="hidden">

        <div class="card">

            <h1>🚀 Admin Dashboard</h1>

            <p class="subtitle">
                مرحباً بك في لوحة تحكم Galaxy Arena
            </p>

            <span class="admin-badge">
                👑 ADMIN
            </span>

        </div>


        <div class="card">

            <div class="stats">

                <div class="stat">
                    <small>Admin Email</small>
                    <strong id="adminEmail">---</strong>
                </div>

                <div class="stat">
                    <small>Galaxy Coins</small>
                    <strong id="adminCoins">---</strong>
                </div>

                <div class="stat">
                    <small>Status</small>
                    <strong>ONLINE</strong>
                </div>

            </div>

        </div>


        <!-- PLAYER SEARCH -->
        <div class="card">

            <h2>🔎 البحث عن لاعب</h2>

            <p class="subtitle">
                اكتب Username اللاعب حتى تشوف رصيده ورتبته.
            </p>

            <input
                type="text"
                id="searchUsername"
                placeholder="مثال: Player123"
            >

            <button onclick="searchPlayer()">
                🔎 بحث عن اللاعب
            </button>

            <div id="playerResult"></div>

        </div>


        <!-- LOGOUT -->
        <div class="card">

            <button class="secondary logout" onclick="logout()">
                🚪 تسجيل الخروج
            </button>

        </div>

    </div>

</div>


<script>

const SUPABASE_URL =
    "https://nubkrxxreuiqefvjbloj.supabase.co";

const SUPABASE_KEY =
    "sb_publishable_PwgyR9vD2dVXwODaZ5yq5g__Aj5O9Sr";

const supabaseClient =
    window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
    );


// ===============================
// STAR BACKGROUND
// ===============================

const stars = document.getElementById("stars");

for (let i = 0; i < 180; i++) {

    const star = document.createElement("div");

    star.className = "star";

    star.style.left =
        Math.random() * 100 + "%";

    star.style.top =
        Math.random() * 100 + "%";

    star.style.animationDelay =
        Math.random() * 3 + "s";

    stars.appendChild(star);
}


// ===============================
// LOGIN
// ===============================

async function login() {

    const email =
        document.getElementById("email").value.trim();

    const password =
        document.getElementById("password").value;

    const status =
        document.getElementById("loginStatus");

    if (!email || !password) {

        status.innerHTML =
            '<span class="error">❌ اكتب الإيميل وكلمة المرور.</span>';

        return;
    }

    status.innerHTML =
        '<span class="loading">🔄 جاري تسجيل الدخول...</span>';

    const { data, error } =
        await supabaseClient.auth.signInWithPassword({
            email,
            password
        });

    if (error) {

        console.error(error);

        status.innerHTML =
            '<span class="error">❌ الإيميل أو كلمة المرور غير صحيحة.</span>';

        return;
    }

    await checkAdmin();

}


// ===============================
// CHECK ADMIN
// ===============================

async function checkAdmin() {

    const status =
        document.getElementById("loginStatus");

    const {
        data: { user }
    } =
        await supabaseClient.auth.getUser();

    if (!user) {

        status.innerHTML =
            '<span class="error">❌ ماكو حساب مسجل.</span>';

        return;
    }

    const { data, error } =
        await supabaseClient.rpc("is_admin");

    if (error) {

        console.error(error);

        status.innerHTML =
            '<span class="error">❌ صار خطأ أثناء التحقق من صلاحيات الأدمن.</span>';

        return;
    }

    if (!data) {

        await supabaseClient.auth.signOut();

        status.innerHTML =
            '<span class="error">🚫 هذا الحساب ليس Admin.</span>';

        return;
    }


    document.getElementById("loginSection")
        .classList.add("hidden");

    document.getElementById("dashboard")
        .classList.remove("hidden");


    document.getElementById("adminEmail")
        .textContent = user.email;


    await loadAdminProfile();

}


// ===============================
// LOAD ADMIN PROFILE
// ===============================

async function loadAdminProfile() {

    const { data, error } =
        await supabaseClient.rpc("get_my_profile");

    if (error) {

        console.error(error);

        document.getElementById("adminCoins")
            .textContent = "---";

        return;
    }

    if (data && data.length > 0) {

        document.getElementById("adminCoins")
            .textContent =
            Number(data[0].galaxy_coins || 0)
                .toLocaleString();

    }

}


// ===============================
// SEARCH PLAYER
// ===============================

async function searchPlayer() {

    const usernameInput =
        document.getElementById("searchUsername");

    const resultBox =
        document.getElementById("playerResult");

    const username =
        usernameInput.value.trim();


    if (!username) {

        resultBox.innerHTML = `
            <div class="status">
                <span class="error">
                    ❌ اكتب اسم المستخدم أولاً.
                </span>
            </div>
        `;

        return;
    }


    resultBox.innerHTML = `
        <div class="status">
            <span class="loading">
                🔎 جاري البحث...
            </span>
        </div>
    `;


    const { data, error } =
        await supabaseClient.rpc(
            "admin_find_player",
            {
                search_username: username
            }
        );


    if (error) {

        console.error(error);

        resultBox.innerHTML = `
            <div class="status">
                <span class="error">
                    ❌ صار خطأ أثناء البحث.
                </span>
            </div>
        `;

        return;
    }


    if (!data || data.length === 0) {

        resultBox.innerHTML = `
            <div class="status">
                <span class="error">
                    ❌ غير موجود هذا اللاعب.
                </span>
            </div>
        `;

        return;
    }


    const player = data[0];


    resultBox.innerHTML = `

        <div class="player-card">

            <h3>
                🎮 ${escapeHtml(player.username)}
            </h3>

            <p>
                💰 Galaxy Coins:
                <strong>
                    ${Number(player.galaxy_coins || 0).toLocaleString()}
                </strong>
            </p>

            <p>
                🏆 Rank:
                <strong>
                    ${escapeHtml(player.rank || "BRONZE")}
                </strong>
            </p>

            <div class="coin-actions">

                <input
                    type="number"
                    id="coinAmount"
                    placeholder="عدد Galaxy Coins"
                    min="1"
                    step="1"
                >

                <button onclick="addCoins()">
                    ➕ إضافة Galaxy Coins
                </button>

                <button
                    class="danger"
                    onclick="removeCoins()"
                >
                    ➖ حذف Galaxy Coins
                </button>

            </div>

            <div id="coinStatus"></div>

        </div>
    `;

}


// ===============================
// ADD COINS
// ===============================

async function addCoins() {

    const username =
        document.getElementById("searchUsername")
            .value.trim();

    const amount =
        Number(document.getElementById("coinAmount").value);

    const status =
        document.getElementById("coinStatus");


    if (!username || !amount || amount <= 0) {

        status.innerHTML = `
            <div class="status">
                <span class="error">
                    ❌ اكتب عدد صحيح من الـ Coins.
                </span>
            </div>
        `;

        return;
    }


    status.innerHTML = `
        <div class="status">
            <span class="loading">
                🔄 جاري إضافة Coins...
            </span>
        </div>
    `;


    const { data, error } =
        await supabaseClient.rpc(
            "admin_add_coins",
            {
                receiver_username: username,
                amount: Math.floor(amount)
            }
        );


    if (error) {

        console.error(error);

        status.innerHTML = `
            <div class="status">
                <span class="error">
                    ❌ فشلت إضافة Coins.
                </span>
            </div>
        `;

        return;
    }


    status.innerHTML = `
        <div class="status">
            <span class="success">
                ✅ تمت إضافة ${Math.floor(amount).toLocaleString()}
                Galaxy Coins بنجاح.
            </span>
        </div>
    `;


    await searchPlayer();

    await loadAdminProfile();

}


// ===============================
// REMOVE COINS
// ===============================

async function removeCoins() {

    const username =
        document.getElementById("searchUsername")
            .value.trim();

    const amount =
        Number(document.getElementById("coinAmount").value);

    const status =
        document.getElementById("coinStatus");


    if (!username || !amount || amount <= 0) {

        status.innerHTML = `
            <div class="status">
                <span class="error">
                    ❌ اكتب عدد صحيح من الـ Coins.
                </span>
            </div>
        `;

        return;
    }


    status.innerHTML = `
        <div class="status">
            <span class="loading">
                🔄 جاري حذف Coins...
            </span>
        </div>
    `;


    const { data, error } =
        await supabaseClient.rpc(
            "admin_remove_coins",
            {
                receiver_username: username,
                amount: Math.floor(amount)
            }
        );


    if (error) {

        console.error(error);

        status.innerHTML = `
            <div class="status">
                <span class="error">
                    ❌ فشل حذف Coins.
                </span>
            </div>
        `;

        return;
    }


    status.innerHTML = `
        <div class="status">
            <span class="success">
                ✅ تمت إزالة ${Math.floor(amount).toLocaleString()}
                Galaxy Coins بنجاح.
            </span>
        </div>
    `;


    await searchPlayer();

    await loadAdminProfile();

}


// ===============================
// LOGOUT
// ===============================

async function logout() {

    await supabaseClient.auth.signOut();

    location.reload();

}


// ===============================
// SECURITY: ESCAPE HTML
// ===============================

function escapeHtml(value) {

    return String(value)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
}


// ===============================
// AUTO LOGIN CHECK
// ===============================

async function checkExistingSession() {

    const {
        data: { session }
    } =
        await supabaseClient.auth.getSession();

    if (session) {

        await checkAdmin();

    }

}


checkExistingSession();

</script>

</body>
</html>
