<script>

/* =====================================================
   SUPABASE
===================================================== */

const SUPABASE_URL =
"https://nubkrxxreuiqefvjbloj.supabase.co";

const SUPABASE_KEY =
"sb_publishable_PwgyR9vD2dVXwODaZ5yq5g__Aj5O9Sr";

const supabaseClient =
window.supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);


let currentUser = null;
let currentProfile = null;
let authMode = "login";


/* =====================================================
   ELEMENTS
===================================================== */

const authModal =
document.querySelector("#authModal");

const resetModal =
document.querySelector("#resetModal");

const newPasswordModal =
document.querySelector("#newPasswordModal");

const authTitle =
document.querySelector("#authTitle");

const authSubtitle =
document.querySelector("#authSubtitle");

const usernameGroup =
document.querySelector("#usernameGroup");

const confirmGroup =
document.querySelector("#confirmGroup");

const authSubmit =
document.querySelector("#authSubmit");

const authMessage =
document.querySelector("#authMessage");


/* =====================================================
   SPACE STARS
===================================================== */

function createStars(){

  const space =
  document.querySelector("#space");

  for(
    let i=0;
    i<100;
    i++
  ){

    const star =
    document.createElement("div");

    star.className =
    "star";

    star.style.left =
    Math.random()*100 + "%";

    star.style.top =
    Math.random()*100 + "%";

    star.style.animationDuration =
    (5 + Math.random()*15) + "s";

    star.style.animationDelay =
    (-Math.random()*15) + "s";

    space.appendChild(star);

  }

}


/* =====================================================
   OPEN LOGIN
===================================================== */

function openLogin(){

  authMode =
  "login";

  authTitle.textContent =
  "تسجيل الدخول";

  authSubtitle.textContent =
  "ادخل إلى حسابك في Galaxy Arena";

  usernameGroup.style.display =
  "none";

  confirmGroup.style.display =
  "none";

  authSubmit.textContent =
  "🚀 تسجيل الدخول";

  authMessage.textContent =
  "";

  document
  .querySelector("#passwordInput")
  .setAttribute(
    "autocomplete",
    "current-password"
  );

  authModal.classList.add("show");

}


/* =====================================================
   OPEN REGISTER
===================================================== */

function openRegister(){

  authMode =
  "register";

  authTitle.textContent =
  "إنشاء حساب";

  authSubtitle.textContent =
  "انضم إلى عالم Galaxy Arena 🌌";

  usernameGroup.style.display =
  "block";

  confirmGroup.style.display =
  "block";

  authSubmit.textContent =
  "✨ إنشاء الحساب";

  authMessage.textContent =
  "";

  document
  .querySelector("#passwordInput")
  .setAttribute(
    "autocomplete",
    "new-password"
  );

  authModal.classList.add("show");

}


/* =====================================================
   CLOSE MODALS
===================================================== */

function closeAuth(){

  authModal.classList.remove(
    "show"
  );

}

function closeReset(){

  resetModal.classList.remove(
    "show"
  );

}


/* =====================================================
   AUTH SUBMIT
===================================================== */

authSubmit.addEventListener(
"click",
async function(){

  const email =
  document
  .querySelector("#emailInput")
  .value
  .trim();

  const password =
  document
  .querySelector("#passwordInput")
  .value;

  if(!email){

    authMessage.textContent =
    "❌ اكتب الإيميل.";

    return;

  }

  if(!password){

    authMessage.textContent =
    "❌ اكتب كلمة المرور.";

    return;

  }


  authSubmit.disabled =
  true;

  authSubmit.textContent =
  "⏳ جاري المعالجة...";


  try{


    if(authMode === "login"){

      const {
        data,
        error
      } =
      await supabaseClient.auth
      .signInWithPassword({

        email:email,

        password:password

      });


      if(error)
      throw error;


      currentUser =
      data.user;

      await loadProfile();

      closeAuth();

      updateUI();

      await createAdminPanel();


      alert(
        "✅ تم تسجيل الدخول بنجاح!"
      );


    }


    else{


      const username =
      document
      .querySelector("#usernameInput")
      .value
      .trim();

      const confirmPassword =
      document
      .querySelector("#confirmPasswordInput")
      .value;


      if(!username){

        throw new Error(
          "اكتب اسم المستخدم."
        );

      }


      if(password.length < 6){

        throw new Error(
          "كلمة المرور يجب أن تكون 6 أحرف أو أكثر."
        );

      }


      if(password !== confirmPassword){

        throw new Error(
          "كلمتا المرور غير متطابقتين."
        );

      }


      const {
        data,
        error
      } =
      await supabaseClient.auth
      .signUp({

        email:email,

        password:password,

        options:{

          data:{

            username:username

          }

        }

      });


      if(error)
      throw error;


      currentUser =
      data.user;


      if(currentUser){

        await loadProfile();

      }


      closeAuth();

      updateUI();

      await createAdminPanel();


      alert(
        "🎉 تم إنشاء الحساب بنجاح!\n\nأهلاً بك في Galaxy Arena 🚀"
      );

    }

  }

  catch(error){

    console.error(
      "AUTH ERROR:",
      error
    );

    authMessage.textContent =
    "❌ " +
    (
      error.message ||
      "حدث خطأ"
    );

  }


  authSubmit.disabled =
  false;

  authSubmit.textContent =
  authMode === "login"
  ? "🚀 تسجيل الدخول"
  : "✨ إنشاء الحساب";

});


/* =====================================================
   LOAD PROFILE
===================================================== */

async function loadProfile(){

  if(!currentUser)
  return;


  const {
    data,
    error
  } =
  await supabaseClient.rpc(
    "get_my_profile"
  );


  if(error){

    console.error(
      "PROFILE ERROR:",
      error
    );

    return;

  }


  currentProfile =
  Array.isArray(data)
  ? data[0]
  : data;


  updateCoins();

}


/* =====================================================
   UPDATE COINS
===================================================== */

function updateCoins(){

  const coins =
  document.querySelector("#coins");

  if(!coins)
  return;


  coins.textContent =
  Number(
    currentProfile
    ?.galaxy_coins ?? 0
  ).toLocaleString();

}


/* =====================================================
   UPDATE UI
===================================================== */

function updateUI(){

  updateCoins();


  const loginBtn =
  document.querySelector("#loginBtn");

  const heroBtn =
  document.querySelector("#heroLoginBtn");


  if(currentUser){

    loginBtn.textContent =
    "تسجيل الخروج";

    loginBtn.onclick =
    logout;


    heroBtn.textContent =
    "👤 حسابي";

    heroBtn.onclick =
    showAccount;

  }

  else{

    loginBtn.textContent =
    "تسجيل الدخول";

    loginBtn.onclick =
    openLogin;


    heroBtn.textContent =
    "🚀 تسجيل الدخول";

    heroBtn.onclick =
    openLogin;

  }

}


/* =====================================================
   ACCOUNT
===================================================== */

function showAccount(){

  alert(

    "👤 حساب Galaxy Arena\n\n" +

    "📧 الإيميل:\n" +
    (
      currentUser?.email ||
      ""
    ) +

    "\n\n" +

    "🪙 Galaxy Coins:\n" +
    Number(
      currentProfile
      ?.galaxy_coins ?? 0
    ).toLocaleString()

  );

}


/* =====================================================
   LOGOUT
===================================================== */

async function logout(){

  await supabaseClient.auth.signOut();

  currentUser =
  null;

  currentProfile =
  null;

  document
  .querySelector("#adminPanel")
  .style.display =
  "none";

  updateUI();

  alert(
    "👋 تم تسجيل الخروج."
  );

}


/* =====================================================
   ADMIN CHECK
===================================================== */

async function checkAdmin(){

  if(!currentUser)
  return false;


  const {
    data,
    error
  } =
  await supabaseClient.rpc(
    "is_admin"
  );


  if(error){

    console.error(
      "ADMIN ERROR:",
      error
    );

    return false;

  }


  return data === true;

}


/* =====================================================
   ADMIN PANEL
===================================================== */

async function createAdminPanel(){

  const admin =
  await checkAdmin();


  const panel =
  document.querySelector(
    "#adminPanel"
  );


  if(!panel)
  return;


  panel.style.display =
  admin
  ? "block"
  : "none";

}


/* =====================================================
   CHANGE COINS
===================================================== */

async function changeCoins(
  action
){

  const username =
  document
  .querySelector("#adminUsername")
  .value
  .trim();

  const amount =
  Number(
    document
    .querySelector("#adminAmount")
    .value
  );


  if(!username){

    alert(
      "❌ اكتب Username."
    );

    return;

  }


  if(
    !amount ||
    amount <= 0
  ){

    alert(
      "❌ اكتب كمية صحيحة."
    );

    return;

  }


  const functionName =
  action === "add"
  ? "admin_add_coins"
  : "admin_remove_coins";


  const {
    error
  } =
  await supabaseClient.rpc(

    functionName,

    {

      receiver_username:
      username,

      amount:
      amount

    }

  );


  if(error){

    alert(
      "❌ فشلت العملية:\n\n" +
      error.message
    );

    return;

  }


  alert(
    action === "add"
    ? "✅ تمت إضافة Coins."
    : "✅ تمت إزالة Coins."
  );


}


/* =====================================================
   BUY COINS
===================================================== */

async function buyCoins(){

  if(!currentUser){

    openLogin();

    return;

  }


  const {
    data,
    error
  } =
  await supabaseClient.rpc(
    "get_coin_packages"
  );


  if(error){

    alert(
      "❌ تعذر تحميل الباقات:\n\n" +
      error.message
    );

    return;

  }


  if(
    !data ||
    data.length === 0
  ){

    alert(
      "⚠️ لا توجد باقات حالياً."
    );

    return;

  }


  let text =
  "🪙 Galaxy Coins\n\n";


  data.forEach(
    (pkg,index)=>{

      text +=

      `${index+1}. ${pkg.name}\n` +

      `🪙 ${Number(pkg.coins).toLocaleString()} Coins\n` +

      `💵 $${pkg.price_usd}\n\n`;

    }
  );


  const choice =
  prompt(
    text +
    "اكتب رقم الباقة:"
  );


  const index =
  Number(choice) - 1;


  if(
    Number.isNaN(index) ||
    !data[index]
  )
  return;


  await startPayment(
    data[index]
  );

}


/* =====================================================
   PAYMENT
===================================================== */

async function startPayment(
  pkg
){

  alert(
    "⏳ جاري تجهيز عملية الدفع..."
  );


  const {
    data,
    error
  } =
  await supabaseClient
  .functions
  .invoke(

    "quick-service",

    {

      body:{

        package_id:
        pkg.id

      }

    }

  );


  if(error){

    alert(
      "❌ خطأ بالدفع:\n\n" +
      error.message
    );

    return;

  }


  if(data?.redirect_url){

    window.location.href =
    data.redirect_url;

    return;

  }


  alert(
    "⚠️ لم يتم استلام رابط الدفع."
  );

}


/* =====================================================
   FORGOT PASSWORD
===================================================== */

document
.querySelector("#forgotLink")
.addEventListener(
"click",
()=>{

  closeAuth();

  document
  .querySelector("#resetEmail")
  .value =
  document
  .querySelector("#emailInput")
  .value
  .trim();

  document
  .querySelector("#resetMessage")
  .textContent =
  "";

  resetModal.classList.add(
    "show"
  );

});


/* =====================================================
   SEND RESET
===================================================== */

document
.querySelector("#sendReset")
.addEventListener(
"click",
async ()=>{

  const email =
  document
  .querySelector("#resetEmail")
  .value
  .trim();

  const message =
  document
  .querySelector("#resetMessage");


  if(!email){

    message.textContent =
    "❌ اكتب الإيميل.";

    return;

  }


  const button =
  document
  .querySelector("#sendReset");


  button.disabled =
  true;

  button.textContent =
  "⏳ جاري الإرسال...";


  try{

    const {
      error
    } =
    await supabaseClient.auth
    .resetPasswordForEmail(

      email,

      {

        redirectTo:
        window.location.origin +
        window.location.pathname

      }

    );


    if(error)
    throw error;


    message.textContent =
    "✅ إذا كان الحساب موجوداً، تم إرسال رابط إعادة التعيين إلى الإيميل.";

  }

  catch(error){

    message.textContent =
    "❌ " +
    error.message;

  }


  button.disabled =
  false;

  button.textContent =
  "📨 إرسال الرابط";

});


/* =====================================================
   PASSWORD RECOVERY
===================================================== */

supabaseClient.auth
.onAuthStateChange(
async(
  event,
  session
)=>{

  if(
    event ===
    "PASSWORD_RECOVERY"
  ){

    newPasswordModal
    .classList
    .add("show");

  }


  if(session){

    currentUser =
    session.user;

    await loadProfile();

    updateUI();

    await createAdminPanel();

  }

});


/* =====================================================
   SAVE NEW PASSWORD
===================================================== */

document
.querySelector("#saveNewPassword")
.addEventListener(
"click",
async ()=>{

  const password =
  document
  .querySelector("#newPassword")
  .value;

  const confirm =
  document
  .querySelector("#newPasswordConfirm")
  .value;

  const message =
  document
  .querySelector("#newPasswordMessage");


  if(password.length < 6){

    message.textContent =
    "❌ كلمة المرور يجب أن تكون 6 أحرف أو أكثر.";

    return;

  }


  if(password !== confirm){

    message.textContent =
    "❌ كلمتا المرور غير متطابقتين.";

    return;

  }


  const button =
  document
  .querySelector("#saveNewPassword");


  button.disabled =
  true;

  button.textContent =
  "⏳ جاري الحفظ...";


  try{

    const {
      error
    } =
    await supabaseClient.auth
    .updateUser({

      password:
      password

    });


    if(error)
    throw error;


    message.textContent =
    "✅ تم تغيير كلمة المرور بنجاح!";


    setTimeout(
      ()=>{

        newPasswordModal
        .classList
        .remove("show");

        window.location.href =
        window.location.origin +
        window.location.pathname;

      },
      1500
    );

  }

  catch(error){

    message.textContent =
    "❌ " +
    error.message;

  }


  button.disabled =
  false;

  button.textContent =
  "🔐 حفظ";

});


/* =====================================================
   BUTTON EVENTS
===================================================== */

document
.querySelector("#closeModal")
.addEventListener(
"click",
closeAuth
);


document
.querySelector("#closeReset")
.addEventListener(
"click",
closeReset
);


document
.querySelector("#switchAuth")
.addEventListener(
"click",
()=>{

  if(
    authMode ===
    "login"
  ){

    openRegister();

  }

  else{

    openLogin();

  }

});


document
.querySelector("#buyCoinsBtn")
.addEventListener(
"click",
buyCoins
);


document
.querySelector("#addCoinsAdmin")
.addEventListener(
"click",
()=>{

  changeCoins("add");

});


document
.querySelector("#removeCoinsAdmin")
.addEventListener(
"click",
()=>{

  changeCoins("remove");

});


/* =====================================================
   CLOSE MODAL ON BACKDROP
===================================================== */

authModal.addEventListener(
"click",
event=>{

  if(
    event.target ===
    authModal
  ){

    closeAuth();

  }

});


resetModal.addEventListener(
"click",
event=>{

  if(
    event.target ===
    resetModal
  ){

    closeReset();

  }

});


/* =====================================================
   START
===================================================== */

async function startApp(){

  createStars();


  const {
    data
  } =
  await supabaseClient
  .auth
  .getSession();


  currentUser =
  data.session
  ? data.session.user
  : null;


  if(currentUser){

    await loadProfile();

    await createAdminPanel();

  }


  updateUI();

}


/* =====================================================
   RUN
===================================================== */

document.addEventListener(
"DOMContentLoaded",
startApp
);

</script>
