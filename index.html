<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#070511">
<title>Username Galaxy V2</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
  font-family:Arial,Tahoma,sans-serif;
}

body{
  min-height:100vh;
  color:#fff;
  background:
    radial-gradient(circle at 15% 15%,rgba(133,55,255,.25),transparent 30%),
    radial-gradient(circle at 85% 80%,rgba(0,225,255,.18),transparent 32%),
    #05020c;
  overflow-x:hidden;
}

body:before{
  content:"";
  position:fixed;
  inset:0;
  pointer-events:none;
  opacity:.25;
  background-image:
    radial-gradient(#fff 1px,transparent 1px),
    radial-gradient(#fff 1px,transparent 1px);
  background-size:90px 90px,150px 150px;
  background-position:10px 20px,50px 80px;
  animation:space 30s linear infinite;
}

@keyframes space{
  from{transform:translateY(0)}
  to{transform:translateY(100px)}
}

.app{
  position:relative;
  z-index:1;
  width:min(1000px,94%);
  margin:auto;
  padding:28px 0 40px;
}

.header{
  text-align:center;
  margin-bottom:22px;
}

.logo{
  font-size:38px;
  font-weight:900;
  background:linear-gradient(90deg,#bd6cff,#00eaff);
  -webkit-background-clip:text;
  color:transparent;
}

.version{
  margin-top:7px;
  color:#8e8a9e;
  font-size:13px;
}

.card{
  background:rgba(13,9,28,.88);
  border:1px solid rgba(150,90,255,.28);
  border-radius:22px;
  padding:20px;
  margin-bottom:18px;
  box-shadow:0 0 35px rgba(91,30,255,.10);
  backdrop-filter:blur(12px);
}

.title{
  font-size:18px;
  font-weight:bold;
  margin-bottom:14px;
}

.modes{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:9px;
}

.mode{
  background:#0b0715;
  border:1px solid #33234e;
  color:#ccc;
  border-radius:13px;
  padding:13px 6px;
  cursor:pointer;
  transition:.2s;
}

.mode.active{
  border-color:#00eaff;
  color:#fff;
  background:linear-gradient(135deg,#241047,#08212b);
  box-shadow:0 0 18px rgba(0,234,255,.12);
}

.grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:12px;
  margin-top:16px;
}

label{
  display:block;
  color:#aaa;
  font-size:13px;
  margin-bottom:7px;
}

input,select{
  width:100%;
  background:#08050f;
  color:#fff;
  border:1px solid #34244d;
  border-radius:12px;
  padding:13px;
  outline:none;
}

input:focus,select:focus{
  border-color:#00eaff;
}

.checks{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:9px;
  margin-top:12px;
}

.check{
  background:#090611;
  border:1px solid #21172f;
  padding:11px;
  border-radius:11px;
  color:#ccc;
  display:flex;
  align-items:center;
  gap:8px;
}

.check input{
  width:auto;
  accent-color:#00eaff;
}

.generate{
  width:100%;
  margin-top:16px;
  padding:15px;
  border:0;
  border-radius:14px;
  color:white;
  font-size:16px;
  font-weight:bold;
  cursor:pointer;
  background:linear-gradient(90deg,#792cff,#00c9ec);
  box-shadow:0 0 24px rgba(0,200,255,.16);
}

.generate:active{
  transform:scale(.99);
}

.toolbar{
  display:flex;
  gap:8px;
  flex-wrap:wrap;
  margin-bottom:14px;
}

.btn{
  background:#100a1d;
  border:1px solid #392650;
  color:#fff;
  padding:10px 13px;
  border-radius:10px;
  cursor:pointer;
}

.btn:hover{
  border-color:#00eaff;
}

.stats{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:12px;
  color:#aaa;
  font-size:13px;
}

.results{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:9px;
  max-height:560px;
  overflow:auto;
  padding:2px;
}

.user{
  position:relative;
  background:#090611;
  border:1px solid #241a34;
  border-radius:12px;
  padding:13px 8px;
  text-align:center;
  direction:ltr;
  transition:.15s;
}

.user:hover{
  border-color:#00eaff;
  transform:translateY(-2px);
}

.name{
  font-weight:bold;
  font-size:16px;
  margin-bottom:9px;
  word-break:break-all;
}

.user-actions{
  display:flex;
  gap:5px;
}

.small{
  flex:1;
  padding:7px 4px;
  border-radius:8px;
  border:1px solid #332345;
  background:#100a19;
  color:#ddd;
  cursor:pointer;
  font-size:11px;
}

.small:hover{
  border-color:#00eaff;
}

.favorite{
  position:absolute;
  top:6px;
  right:7px;
  border:0;
  background:none;
  color:#666;
  cursor:pointer;
  font-size:15px;
}

.favorite.on{
  color:#ff4fc8;
}

.empty{
  grid-column:1/-1;
  text-align:center;
  color:#666;
  padding:40px 10px;
}

.footer{
  text-align:center;
  color:#555;
  font-size:11px;
  margin-top:10px;
}

.badge{
  display:inline-block;
  margin-right:5px;
  padding:3px 6px;
  border-radius:6px;
  background:#171025;
  color:#8defff;
  font-size:10px;
}

@media(max-width:650px){
  .logo{font-size:30px}
  .modes{grid-template-columns:1fr}
  .grid{grid-template-columns:1fr}
  .checks{grid-template-columns:1fr}
  .results{grid-template-columns:repeat(2,1fr)}
  .stats{align-items:flex-start;gap:8px;flex-direction:column}
}

@media(max-width:380px){
  .results{grid-template-columns:1fr}
}
</style>
</head>

<body>

<div class="app">

  <header class="header">
    <div class="logo">USERNAME GALAXY</div>
    <div class="version">V2 • Short Username Generator</div>
  </header>

  <section class="card">

    <div class="title">⚡ إعدادات التوليد</div>

    <div class="modes">
      <button class="mode active" data-mode="3">
        ثلاثي<br>
        <small>3 أحرف</small>
      </button>

      <button class="mode" data-mode="semi">
        شبه ثلاثي<br>
        <small>3 + رمز</small>
      </button>

      <button class="mode" data-mode="4">
        رباعي<br>
        <small>4 أحرف</small>
      </button>
    </div>

    <div class="grid">

      <div>
        <label>عدد النتائج</label>
        <input id="amount" type="number" min="1" max="10000" value="500">
      </div>

      <div>
        <label>نوع التركيبة</label>
        <select id="characters">
          <option value="letters">حروف فقط</option>
          <option value="numbers">أرقام فقط</option>
          <option value="mixed" selected>حروف + أرقام</option>
        </select>
      </div>

    </div>

    <div class="checks">

      <label class="check">
        <input id="underscore" type="checkbox">
        السماح بـ _
      </label>

      <label class="check">
        <input id="dot" type="checkbox">
        السماح بـ .
      </label>

    </div>

    <button class="generate" onclick="generate()">
      🚀 توليد اليوزرات
    </button>

  </section>


  <section class="card">

    <div class="stats">
      <span id="count">0 نتيجة</span>
      <span id="favCount">0 مفضلة</span>
    </div>

    <div class="toolbar">

      <button class="btn" onclick="copyAll()">
        📋 نسخ الكل
      </button>

      <button class="btn" onclick="copyFavorites()">
        ❤️ نسخ المفضلة
      </button>

      <button class="btn" onclick="downloadTXT()">
        💾 TXT
      </button>

      <button class="btn" onclick="openRandom()">
        🎯 فحص عشوائي
      </button>

      <button class="btn" onclick="clearAll()">
        🗑️ مسح
      </button>

    </div>

    <div id="results" class="results">
      <div class="empty">
        اضغط «توليد اليوزرات» للبدء
      </div>
    </div>

  </section>

  <div class="footer">
    Username Galaxy V2
  </div>

</div>


<script>

let mode = "3";
let users = [];
let favorites = new Set();

const letters = "abcdefghijklmnopqrstuvwxyz";
const numbers = "0123456789";

document.querySelectorAll(".mode").forEach(btn => {

  btn.addEventListener("click", () => {

    document.querySelectorAll(".mode")
      .forEach(x => x.classList.remove("active"));

    btn.classList.add("active");

    mode = btn.dataset.mode;

  });

});


function getChars(){

  const type = document.getElementById("characters").value;

  let chars = "";

  if(type === "letters")
    chars = letters;

  if(type === "numbers")
    chars = numbers;

  if(type === "mixed")
    chars = letters + numbers;

  return chars;
}


function randomChar(chars){

  return chars[Math.floor(Math.random() * chars.length)];

}


function randomString(length, chars){

  let result = "";

  for(let i=0;i<length;i++){
    result += randomChar(chars);
  }

  return result;

}


function specialUsername(chars){

  const allowUnderscore =
    document.getElementById("underscore").checked;

  const allowDot =
    document.getElementById("dot").checked;

  let symbols = "";

  if(allowUnderscore) symbols += "_";
  if(allowDot) symbols += ".";

  if(!symbols){

    return randomString(4, chars);

  }

  let symbol = randomChar(symbols);

  let position = Math.floor(Math.random() * 4);

  let result = "";

  for(let i=0;i<4;i++){

    if(i === position)
      result += symbol;
    else
      result += randomChar(chars);

  }

  return result;

}


function generate(){

  const amount = Math.min(
    Math.max(
      parseInt(document.getElementById("amount").value) || 500,
      1
    ),
    10000
  );

  const chars = getChars();

  if(!chars){

    alert("اختر نوع الأحرف.");
    return;

  }

  const set = new Set();

  let tries = 0;
  const maxTries = amount * 100;

  while(set.size < amount && tries < maxTries){

    let username;

    if(mode === "3"){

      username = randomString(3, chars);

    }else if(mode === "4"){

      username = randomString(4, chars);

    }else{

      username = specialUsername(chars);

    }

    if(
      username.length >= 3 &&
      username.length <= 4 &&
      !username.startsWith(".") &&
      !username.endsWith(".") &&
      !username.includes("..")
    ){

      set.add(username);

    }

    tries++;

  }

  users = Array.from(set);

  render();

}


function render(){

  const box = document.getElementById("results");

  document.getElementById("count").textContent =
    users.length + " نتيجة";

  document.getElementById("favCount").textContent =
    favorites.size + " مفضلة";

  if(!users.length){

    box.innerHTML =
      '<div class="empty">لا توجد نتائج</div>';

    return;

  }

  box.innerHTML = "";

  users.forEach(username => {

    const card = document.createElement("div");

    card.className = "user";

    const favButton =
      document.createElement("button");

    favButton.className =
      "favorite " +
      (favorites.has(username) ? "on" : "");

    favButton.textContent = "♥";

    favButton.onclick = () => {

      if(favorites.has(username)){
        favorites.delete(username);
      }else{
        favorites.add(username);
      }

      render();

    };


    const name =
      document.createElement("div");

    name.className = "name";
    name.textContent = username;


    const actions =
      document.createElement("div");

    actions.className = "user-actions";


    const copy =
      document.createElement("button");

    copy.className = "small";
    copy.textContent = "نسخ";

    copy.onclick = () => {

      navigator.clipboard.writeText(username);

      copy.textContent = "✓";

      setTimeout(()=>{
        copy.textContent = "نسخ";
      },800);

    };


    const check =
      document.createElement("button");

    check.className = "small";
    check.textContent = "فحص";

    check.onclick = () => {

      window.open(
        "https://www.instagram.com/" +
        encodeURIComponent(username) +
        "/",
        "_blank"
      );

    };


    actions.appendChild(copy);
    actions.appendChild(check);

    card.appendChild(favButton);
    card.appendChild(name);
    card.appendChild(actions);

    box.appendChild(card);

  });

}


function copyAll(){

  if(!users.length){

    alert("ماكو نتائج.");
    return;

  }

  navigator.clipboard.writeText(
    users.join("\n")
  );

  alert("تم نسخ " + users.length + " يوزر.");

}


function copyFavorites(){

  const list =
    users.filter(x => favorites.has(x));

  if(!list.length){

    alert("ماكو يوزرات بالمفضلة.");
    return;

  }

  navigator.clipboard.writeText(
    list.join("\n")
  );

  alert("تم نسخ المفضلة.");

}


function downloadTXT(){

  if(!users.length){

    alert("ماكو نتائج.");
    return;

  }

  const blob =
    new Blob(
      [users.join("\n")],
      {type:"text/plain;charset=utf-8"}
    );

  const url =
    URL.createObjectURL(blob);

  const a =
    document.createElement("a");

  a.href = url;
  a.download = "username-galaxy-v2.txt";

  document.body.appendChild(a);

  a.click();

  a.remove();

  URL.revokeObjectURL(url);

}


function openRandom(){

  if(!users.length){

    alert("ولد يوزرات أولاً.");
    return;

  }

  const username =
    users[Math.floor(Math.random() * users.length)];

  window.open(
    "https://www.instagram.com/" +
    encodeURIComponent(username) +
    "/",
    "_blank"
  );

}


function clearAll(){

  users = [];
  favorites.clear();

  render();

}

</script>

</body>
</html>
